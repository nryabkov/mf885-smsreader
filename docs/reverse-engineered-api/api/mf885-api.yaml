# Unofficial reverse-engineered API specification for ZMI MF855/MF885-family routers.
# Keep semantics, transport and live-tested behaviour as separate evidence claims.

spec_version: 2
name: ZMI MF855/MF885 local XML API
status: reverse-engineered
base_url_default: http://192.168.21.1
physical_xml_api_path: /xml_action.cgi
digest_xml_uri: /cgi/xml_action.cgi

confidence_levels:
  - live-tested
  - firmware-confirmed
  - frontend-confirmed
  - companion-app-confirmed
  - schema-only
  - speculative

provenance_values:
  - live-device
  - project-client
  - web-ui-js
  - android-apk
  - xml-schema
  - native-handler
  - binary-strings

transport:
  model_read:
    method: GET
    path: /xml_action.cgi
    query:
      method: get
      module: duster
      file: "<model>"
  model_write:
    method: POST
    path: /xml_action.cgi
    query:
      method: set
      module: duster
      file: "<model>"
    content_type: application/xml
  command_on_read:
    method: GET
    path: /xml_action.cgi
    query:
      method: get
      module: duster
      file: "<model>"
    body: none
  action:
    method: GET
    path: /xml_action.cgi
    query:
      Action: "<action>"

authentication:
  type: http-digest-with-vendor-login-handshake
  challenge_path: /login.cgi
  algorithm: MD5
  realm: Highwmg
  qop_default: auth
  notes:
    - Login handshake HA2 uses GET:/cgi/protected.cgi.
    - XML Authorization header uses uri=/cgi/xml_action.cgi and HA2 for that URI.
    - The physical XML request still targets /xml_action.cgi.
    - The 1.2.42 ZMI Android client independently confirms this physical-path/Digest-URI split.
    - Plain HTTP means request/response bodies are not encrypted.
  app_power_session:
    scope: [reboot, poweroff]
    login_query_client: APP
    authorization_client: APP
    query_digest_uri: /cgi/protected.cgi
    header_digest_uri: /cgi/xml_action.cgi
    independent_query_and_header_proofs: true
    first_process_nonce_counts: { query: 2, login_header: 3 }
    persist_login_authorization_for_gets: true
    request_headers: [Authorization, Expires, Cache-Control, Pragma, optional_scoped_login_cookie]
    excludes_webui_headers: [synthetic_platform_cookie, X-Requested-With, Content-Type]
    redirects: reject
    reject_response_classes: [redirect, html, unexpected_text]
    pre_command_probe: status1
    retry: false
    auth_failure_states: [UNAUTHORIZED, TIMEOUT, KICKOFF]
  documentation: ../AUTHENTICATION.md

firmware_profiles:
  "2.5.94":
    id: zmi-mf885-2.5.94
    model: MF885
    hardware_family:
      - MF885
      - MF96 Ver.D
    confidence: firmware-confirmed
    provenance: [live-device, xml-schema, native-handler, android-apk, project-client]
    diagnostic_models: [status1, wan, Engineer_parameter]
    power_transport_evidence:
      confidence: companion-app-confirmed
      apk:
        package: com.xiaomi.mifi
        version: "1.2.42"
        apk_sha256: 66547e5a9423c380845ad4d49e069009c6623e0c36956fd1cabd2fe1df22f8ca
        classes_dex_sha256: 5d679764de58c25d8866068108a01361d0571a0e2e05ad8a55f23ca1b1516eba
        provenance_note: supplied English APK is repacked/test-key-signed, not a cryptographically verified original store APK
      commands:
        reboot: { transport: command_on_read, file: reset, body: none }
        poweroff: { transport: command_on_read, file: poweroff, body: none }
        restore_defaults: { transport: command_on_read, file: restore_defaults, body: none }
    runtime_support:
      destructive_enabled: true
      implementation: transport-aware destructive model descriptors
      enabled_commands: [reboot, poweroff]
      notes:
        - Factory reset remains deliberately unexposed in the dashboard.
        - Live exact-device execution remains a separate evidence level.
    policy:
      unknown_writes_are_read_only: true
      verify_normal_writes_by_readback: true
      never_retry_destructive_command_automatically: true

  "2.5.94_release_MF855_NZ_CP_2.129.003":
    id: zmi-mf855-nz-2.5.94
    confidence: companion-app-confirmed
    provenance: [android-apk, project-client]
    notes:
      - The analysed APK explicitly contains MF855 plus MF885/MF96 Ver.D support and uses the same local power GET endpoints.
      - The clean MF885 golden carries this release-lineage string, so the project preserves power availability if the router reports the full build string rather than short version 2.5.94.
    power_commands:
      reboot: { transport: command_on_read, file: reset, body: none, runtime_enabled: true }
      poweroff: { transport: command_on_read, file: poweroff, body: none, runtime_enabled: true }

  "2.5.96":
    id: zmi-mf855-mf885-2.5.96
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js, native-handler, project-client]
    diagnostic_models: [status1, wan, Engineer_parameter]
    destructive_transport:
      implementation: retained-project-mapping
      method: POST
      body: semantic XML tree
    policy:
      unknown_writes_are_read_only: true
      verify_normal_writes_by_readback: true

models:
  status1:
    description: Primary router status snapshot covering system, battery, WAN, traffic and identifiers.
    access: read
    risk: sensitive
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js, project-client, android-apk]
    transport: model_read
    known_fields:
      - RGW/sysinfo/hardware_version
      - RGW/sysinfo/device_name
      - RGW/sysinfo/version_num
      - RGW/sysinfo/version_date
      - RGW/sysinfo/model_name
      - RGW/batteryinfo/Battery_percent
      - RGW/batteryinfo/Battery_status
      - RGW/batteryinfo/Battery_level
      - RGW/batteryinfo/Charger_status
      - RGW/batteryinfo/Output_current
      - RGW/wan/NW_register_status
      - RGW/wan/ip
      - RGW/wan/ConnType
      - RGW/wan/proto
    notes:
      - Values may be empty, NA, stale during transitions, or firmware-specific enums.
      - Responses may contain identifiers/configuration material; redact before sharing.
    exact_lv01_2_5_94_battery_semantics:
      confidence: companion-app-confirmed
      provenance: [android-apk, project-client, live-device]
      battery_status:
        "1": charging-input
        "2": usb-a-feeding
        "3": normal-on-battery
      charger_status_when_battery_status_1:
        "4": full
        "5": abnormal-charging
        other_including_0: normal-charging
      notes:
        - Charger_status is a charging substatus, not a cable-present or USB-output flag.
        - CDetectStatus is a separate field and must not be substituted for Charger_status.
        - Missing fields remain distinct from the literal value "0".

  wan:
    description: Cellular WAN state and firmware-specific configuration fields.
    access: read-write-when-profile-confirmed
    risk: medium
    confidence: firmware-confirmed
    provenance: [xml-schema, project-client, android-apk]
    read_transport: model_read
    write_transport: model_write
    known_leaf_names:
      - connect_disconnect
      - connect_mode
      - NW_mode
      - prefer_mode
      - prefer_lte_type
      - pdp_enable
      - connect_action
      - disconnect_action
      - pdp_action
      - manual_network
      - network_select
      - apn
      - pdp_type
      - username
      - auth_type
    notes:
      - Enum mappings are firmware-specific.
      - The Android client contains both GET/read and POST/set WAN routes.

  Engineer_parameter:
    description: GSM/UMTS/LTE engineering telemetry.
    access: read
    risk: low-to-sensitive
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js, project-client]
    transport: model_read

  message:
    description: SMS list/read/send/delete/settings.
    access: read-write-command
    risk: sensitive
    confidence: live-tested
    provenance: [live-device, project-client, web-ui-js, xml-schema, android-apk]
    transport: model_write
    known_commands:
      GET_RCV_SMS_LOCAL: { purpose: Read inbox page. }
      SEND_SMS: { purpose: Send SMS., sms_cmd: "4" }
      DELETE_SMS: { purpose: Delete SMS., sms_cmd: "6" }
    encoding:
      sms_content: UTF-16BE hexadecimal on analysed client path

  statistics:
    description: Traffic/statistics model; reset variants are firmware-specific.
    access: read-write-command
    risk: destructive-when-resetting
    confidence: live-tested
    provenance: [live-device, project-client, web-ui-js, xml-schema, android-apk]

  WanStatistics:
    description: WAN byte totals.
    access: read
    risk: low
    confidence: live-tested
    fields:
      tx_byte_all: { unit: bytes, meaning: total mobile-WAN upload bytes }
      rx_byte_all: { unit: bytes, meaning: total mobile-WAN download bytes }
    notes:
      - Do not mix with per-device/LAN/WLAN/billing-period counters.

  admin:
    description: Router management/admin settings.
    access: read-write
    risk: critical-secrets
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js, android-apk]
    read_transport: model_read
    write_transport: model_write

  reset:
    description: Router reboot/restart model.
    risk: destructive-connection-dropping
    semantic_confidence: firmware-confirmed
    semantic_provenance: [xml-schema, native-handler]
    known_tree: RGW/reboot
    firmware_2_5_94_client_trigger:
      confidence: companion-app-confirmed
      provenance: [android-apk, project-client]
      transport: command_on_read
      request: "GET /xml_action.cgi?method=get&module=duster&file=reset"
      body: none
      runtime_enabled: true
      runtime_identity:
        models: [LV01, MF885]
        firmware_exact: 2.5.94_release_MF855_NZ_CP_2.129.003
        hardware_if_reported: Ver.D
        missing_hardware_allowed_for: [LV01]
        source: fresh-status1-before-command
        override: none
      automatic_retry: false
      response_outcomes:
        http_response: { outcome: request-accepted, effect_confirmed: false }
        connection_loss: { outcome: delivery-unknown, effect_confirmed: false }
    notes:
      - reset is reboot, not factory reset.
      - Do not automatically retry after timeout/connection loss.

  poweroff:
    description: Normal router shutdown/power-off model.
    risk: destructive-connection-dropping
    semantic_confidence: firmware-confirmed
    semantic_provenance: [xml-schema]
    known_tree: RGW/shutdown
    firmware_2_5_94_client_trigger:
      confidence: companion-app-confirmed
      provenance: [android-apk, project-client]
      transport: command_on_read
      request: "GET /xml_action.cgi?method=get&module=duster&file=poweroff"
      body: none
      runtime_enabled: true
      runtime_identity:
        models: [LV01, MF885]
        firmware_exact: 2.5.94_release_MF855_NZ_CP_2.129.003
        hardware_if_reported: Ver.D
        missing_hardware_allowed_for: [LV01]
        source: fresh-status1-before-command
        override: none
      automatic_retry: false
      response_outcomes:
        http_response: { outcome: request-accepted, effect_confirmed: false }
        connection_loss: { outcome: delivery-unknown, effect_confirmed: false }
    notes:
      - The analysed Android shutdown UI uses poweroff, not trueshutdown.
      - Do not automatically retry after timeout/connection loss.

  restore_defaults:
    description: Restore factory defaults; deliberately separate from reboot.
    risk: critical-destructive
    semantic_confidence: firmware-confirmed
    firmware_2_5_94_client_trigger:
      confidence: companion-app-confirmed
      provenance: [android-apk]
      transport: command_on_read
      request: "GET /xml_action.cgi?method=get&module=duster&file=restore_defaults"
      body: none
      runtime_enabled: false
    notes:
      - Never substitute for reset when implementing Restart/Reboot.
      - Deliberately not exposed as a dashboard control.

  trueshutdown:
    description: Additional shutdown-related family model with unresolved distinction from normal poweroff.
    access: unadvertised
    confidence: schema-only
    notes:
      - The recovered APK 1.2.42 normal shutdown UI does not use this model.

  upgrade_firmware:
    description: Firmware update/backup state model.
    access: read
    risk: high
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js, native-handler, android-apk]

  debugmodeon:
    description: Hidden engineering/debug mode contract.
    access: command-like
    risk: security-sensitive
    confidence: firmware-confirmed
    provenance: [xml-schema, native-handler, binary-strings]
    xml_contract: RGW/debugon/openmode

  control_telnet:
    description: Telnet-enable configuration contract; listening service remains unproven on analysed stock builds.
    access: write-only-when-profile-confirmed
    risk: security-sensitive
    confidence: schema-only
    provenance: [xml-schema, project-client]

  diagnostic:
    description: Diagnostic XML contract; schema presence is not proof of an active arbitrary-command backend.
    access: none-confirmed
    confidence: schema-only
    provenance: [xml-schema, native-handler]

actions:
  GetInfo:
    method: GET
    path: /xml_action.cgi
    query: { Action: GetInfo, Id: "<id>" }
    confidence: firmware-confirmed
    provenance: [web-ui-js, native-handler, android-apk]

  BackupFwStart:
    method: GET
    path: /xml_action.cgi
    query: { Action: BackupFwStart }
    confidence: firmware-confirmed
    provenance: [web-ui-js, native-handler, android-apk]

  BackupFw:
    method: GET
    path: /xml_action.cgi
    query: { Action: BackupFw }
    risk: critical-sensitive-download
    confidence: firmware-confirmed
    provenance: [web-ui-js, native-handler]

  UploadFirmware:
    method: POST
    path: /xml_action.cgi
    multipart: true
    query: { Action: Upload, file: upgrade, command: "" }
    risk: critical
    confidence: frontend-confirmed

  RestoreConfig:
    method: POST
    path: /xml_action.cgi
    multipart: true
    query: { Action: Upload, file: backfile, config_backup: "" }
    risk: critical
    confidence: frontend-confirmed

client_rules:
  - Keep physical /xml_action.cgi separate from Digest uri /cgi/xml_action.cgi.
  - Use a fresh scoped client=APP session for reboot/poweroff; never replay a destructive command after any response, authentication failure, timeout, or connection loss.
  - For normal writes, POST/SET then read back where possible.
  - For MF885/MF855 2.5.94-family reboot/poweroff, the recovered companion client and project profiles use GET method=get with no XML body.
  - Destructive transport is profile-specific; string descriptors preserve the retained POST behaviour for older mappings.
  - Keep factory reset separate and unexposed unless deliberately implemented.
  - Keep unknown firmware enum values raw.
  - Never probe unknown destructive values merely because a schema exists.
  - Redact credentials, Digest material and device identifiers from diagnostics.
