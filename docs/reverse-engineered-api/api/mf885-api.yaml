# Unofficial reverse-engineered API specification for ZMI MF855/MF885-family routers.
#
# This file is intentionally conservative. A schema found in firmware does not imply
# that a callable backend exists. Add write mappings only after confirming the exact
# request on a named firmware build.

spec_version: 2
name: ZMI MF855/MF885 local XML API
status: reverse-engineered
base_url_default: http://192.168.21.1
xml_api_path: /xml_action.cgi
digest_uri: /cgi/xml_action.cgi

confidence_levels:
  - live-tested
  - firmware-confirmed
  - frontend-confirmed
  - schema-only
  - speculative

provenance_values:
  - live-device
  - project-client
  - web-ui-js
  - xml-schema
  - native-handler
  - binary-strings
  - firmware-static-analysis

transport:
  # Physical HTTP path. Do not replace this with digest_uri.
  model_read:
    method: GET
    path: /xml_action.cgi
    query:
      method: get
      module: duster
      file: "<model>"
  model_write:
    method: POST
    path: /xml_action.cgi
    query:
      method: set
      module: duster
      file: "<model>"
    content_type: application/xml
  model_command_read:
    method: GET
    path: /xml_action.cgi
    query:
      method: get
      file: "<model>"
      command: "<command>"
  action:
    method: GET
    path: /xml_action.cgi
    query:
      Action: "<action>"

authentication:
  type: http-digest-with-vendor-login-handshake
  challenge_path: /login.cgi
  algorithm: MD5
  qop_default: auth
  digest_uri: /cgi/xml_action.cgi
  notes:
    - Actual XML HTTP requests target /xml_action.cgi.
    - Login query response uses HA2 for GET:/cgi/protected.cgi.
    - XML Authorization uses uri=/cgi/xml_action.cgi and HA2 for <METHOD>:/cgi/xml_action.cgi.
    - Login consumes nonce count 00000001; the next XML request starts at 00000002.
    - Plain HTTP means request/response bodies are not encrypted.
  documentation: ../AUTHENTICATION.md

firmware_profiles:
  "2.5.94":
    id: zmi-mf885-2.5.94
    model: MF885
    confidence: firmware-confirmed
    provenance:
      - live-device
      - xml-schema
      - web-ui-js
      - project-client
      - firmware-static-analysis
    static_analysis:
      hardware: ZMI MF885 / MF96 Ver.D
      release_lineage: 2.5.94_release_MF855_NZ_CP_2.129.003
      backup_size_bytes: 8323644
      backup_sha256: 2b5880fc26805918bb574d07341ea9b863f8261be34c3bf9766fac0929204531
      oslo_raw_size_bytes: 9648064
      oslo_raw_sha256: d51fb378d8ccf68662174f39d6b8c4f6be5571280790bc3a4dc4a9e8a967078c
      documentation: ../MF885_2.5.94_STATIC_ANALYSIS.md
    diagnostic_models:
      - status1
      - wan
      - Engineer_parameter
    destructive:
      reset:
        file: reset
        tree: reboot
        confidence: firmware-confirmed
        meaning: restart/reboot, not factory reset
        retry_on_transport_loss: false
      # poweroff/trueshutdown are deliberately absent for 2.5.94.
    policy:
      unknown_writes_are_read_only: true
      verify_normal_writes_by_readback: true
      do_not_retry_destructive_transport_loss: true

  "2.5.94_release_MF855_NZ_CP_2.129.003":
    id: zmi-mf855-nz-2.5.94
    confidence: firmware-confirmed
    provenance:
      - xml-schema
      - web-ui-js
      - firmware-static-analysis
    destructive:
      reset:
        file: reset
        tree: reboot
        confidence: firmware-confirmed
        retry_on_transport_loss: false
    notes:
      - The clean MF885 Ver.D golden analysed by this project carries this release-lineage string.
      - The full-string profile retains conservative WAN enum mappings but shares the confirmed reboot contract.

  "2.5.96":
    id: zmi-mf855-mf885-2.5.96
    confidence: firmware-confirmed
    provenance:
      - xml-schema
      - web-ui-js
      - native-handler
      - project-client
    diagnostic_models:
      - status1
      - wan
      - Engineer_parameter
    destructive:
      reset:
        file: reset
        tree: reboot
        confidence: firmware-confirmed
      poweroff:
        file: poweroff
        tree: shutdown
        confidence: firmware-confirmed
    policy:
      unknown_writes_are_read_only: true
      verify_normal_writes_by_readback: true
      do_not_retry_destructive_transport_loss: true

models:
  status1:
    description: Large primary status snapshot covering system, battery, WAN, traffic and identifiers.
    access: read
    risk: sensitive
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js, project-client]
    transport: model_read
    known_fields:
      - RGW/sysinfo/hardware_version
      - RGW/sysinfo/device_name
      - RGW/sysinfo/version_num
      - RGW/sysinfo/version_date
      - RGW/sysinfo/model_name
      - RGW/batteryinfo/Battery_percent
      - RGW/batteryinfo/Battery_status
      - RGW/batteryinfo/Charger_status
      - RGW/wan/NW_register_status
      - RGW/wan/ip
      - RGW/wan/ConnType
      - RGW/wan/proto
    notes:
      - Values may be empty, NA, stale during transitions, or firmware-specific numeric enums.
      - Responses can contain identifiers or configuration material; redact before sharing.

  wan:
    description: Cellular WAN state and firmware-specific configuration fields.
    access: read-write-when-profile-confirmed
    risk: medium
    confidence: firmware-confirmed
    provenance: [xml-schema, project-client]
    transport: model_read
    known_leaf_names:
      - connect_disconnect
      - connect_mode
      - NW_mode
      - prefer_mode
      - prefer_lte_type
      - pdp_enable
      - connect_action
      - disconnect_action
      - pdp_action
      - manual_network
      - network_select
      - apn
      - pdp_type
      - username
      - auth_type
    known_2_5_96_enum_mappings:
      sim:
        "0": Initializing
        "1": Ready
      registration:
        "0": Not registered
        "1": Registered (home)
        "2": Searching
        "5": Registered (roaming)
      roaming:
        "0": Home network
        "1": Roaming
      pdp_state:
        "0": Disconnected
        "1": Connected
        "2": Connecting
      pdp_type:
        "0": IPv4
        "1": IPv6
        "2": IPv4/IPv6
        IP: IPv4
        IPV6: IPv6
        IPV4V6: IPv4/IPv6
    notes:
      - Do not reuse these enum mappings for another firmware without evidence.
      - Cellular WAN writes are advertised only when explicitly supplied by the active profile.
      - "Live observation on MF885: toggling Auto APN off then on recovered a PDP session stuck in connecting; root cause unknown."

  Engineer_parameter:
    description: GSM/UMTS/LTE engineering telemetry.
    access: read
    risk: low-to-sensitive
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js, project-client]
    transport: model_read
    known_fields:
      - RGW/Engi/Dev/vendor
      - RGW/Engi/Dev/model
      - RGW/Engi/Dev/fw_ver
      - RGW/Engi/GSM/rxSigLevel
      - RGW/Engi/GSM/mcc
      - RGW/Engi/GSM/mnc
      - RGW/Engi/GSM/lac
      - RGW/Engi/GSM/ci
      - RGW/Engi/GSM/arfcn
    notes:
      - Analysed schemas expose more than 100 leaf fields.
      - LTE fields are used to surface band, EARFCN, PCI, cell ID, TAC, RSRP, RSRQ, SINR/CQI where present.

  message:
    description: SMS list, read-state, delete, send, storage/settings and capacity operations.
    access: read-write-command
    risk: sensitive
    confidence: live-tested
    provenance: [live-device, project-client, web-ui-js, xml-schema]
    transport: model_write
    command_selector_fields:
      - RGW/message/flag/message_flag
      - RGW/message/flag/sms_cmd
    known_commands:
      GET_RCV_SMS_LOCAL:
        purpose: Read an inbox page.
        request_fields:
          - RGW/message/get_message/page_number
      SEND_SMS:
        purpose: Send an SMS.
        request_fields:
          - RGW/message/send_save_message/contacts
          - RGW/message/send_save_message/content
          - RGW/message/send_save_message/encode_type
          - RGW/message/send_save_message/sms_time
    encoding:
      sms_content: UTF-16BE hexadecimal on the analysed UI/API path
    notes:
      - Some firmware uses total_number as a page count rather than a message count.
      - Guard against repeated or empty pages and deduplicate messages.

  statistics:
    description: Traffic/statistics command model; reset details vary by firmware.
    access: read-write-command
    risk: destructive-when-resetting
    confidence: live-tested
    provenance: [live-device, project-client, web-ui-js, xml-schema]
    transport: model_read
    notes:
      - Multiple statistics-reset variants exist across firmware; verify by reading counters after a reset request.
      - This counter reset is unrelated to the reset/reboot firmware model.

  WanStatistics:
    description: WAN byte counters commonly embedded in status/statistics responses.
    access: read
    risk: low
    confidence: live-tested
    provenance: [live-device, project-client, xml-schema]
    fields:
      tx_byte_all:
        type: unsigned-integer
        unit: bytes
        meaning: total mobile-WAN upload bytes
      rx_byte_all:
        type: unsigned-integer
        unit: bytes
        meaning: total mobile-WAN download bytes
    notes:
      - Do not add LAN/WLAN, per-device, session or billing-period counters to these totals.

  admin:
    description: Router management and administrator settings.
    access: read-write
    risk: critical-secrets
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js]
    transport: model_read
    known_fields:
      - RGW/management/router_user_list
      - RGW/management/router_username
      - RGW/management/router_password
      - RGW/management/httpd_port
      - RGW/management/web_wlan_enable
      - RGW/management/web_wan_enable
      - RGW/management/session_timeout
    notes:
      - Never log or publish an unredacted response.

  config_save:
    description: Configuration-export data model.
    access: read-export
    risk: critical-secrets
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js]
    transport: model_read
    may_contain:
      - administrator credentials
      - Wi-Fi keys
      - APN credentials
      - DDNS credentials
      - LAN/DHCP settings
      - firewall/NAT/routes
      - device lists
      - Telnet-related persistent state
    notes:
      - Treat all configuration backups as secrets.

  reset:
    description: Restart/reboot command path. The firmware model name reset does not mean factory reset.
    access: write-command
    risk: destructive
    confidence: firmware-confirmed
    provenance: [xml-schema, native-handler, project-client, firmware-static-analysis]
    transport: model_write
    known_tree: RGW/reboot
    confirmed_profiles:
      - "2.5.94"
      - "2.5.94_release_MF855_NZ_CP_2.129.003"
      - "2.5.96"
    request_example: '<RGW><reboot/></RGW>'
    notes:
      - On MF885 2.5.94, restore_defaults is a separate model; reset/reboot is not factory reset.
      - Restart is the UI label for the same operation the client calls reboot.
      - Connection loss before an HTTP reply can be expected; do not blindly retry.

  poweroff:
    description: Power-off command path enabled only on profiles where the exact destructive mapping is confirmed.
    access: write-command-when-profile-confirmed
    risk: destructive
    confidence: firmware-confirmed-on-2.5.96
    provenance: [project-client, xml-schema]
    transport: model_write
    known_tree: RGW/shutdown
    confirmed_profiles:
      - "2.5.96"
    notes:
      - The schema/name is present in 2.5.94 firmware material, but the 2.5.94 compatibility profile intentionally does not advertise it yet.
      - Other variants such as trueshutdown are intentionally not documented as supported.

  upgrade_firmware:
    description: Firmware update/backup state model.
    access: read
    risk: high
    confidence: firmware-confirmed
    provenance: [xml-schema, web-ui-js, native-handler]
    transport: model_read
    known_fields:
      - backup_status
      - backup_progress
      - backup_fail_cause

  debugmodeon:
    description: Hidden engineering/debug mode contract.
    access: command-like
    risk: security-sensitive
    confidence: firmware-confirmed
    provenance: [xml-schema, native-handler, binary-strings]
    transport: model_write
    xml_contract: RGW/debugon/openmode
    native_effect:
      deeply_traced_firmware: "2.5.96"
      internal_mode: 8
      exact_external_interfaces: unknown
    notes:
      - Static evidence ties the path to modem/AT/USB handling.
      - Exact USB descriptor/interface changes require live before/after enumeration.

  control_telnet:
    description: Telnet-enable configuration contract; a listening service is not proven.
    access: write-only-when-profile-confirmed
    risk: security-sensitive
    confidence: schema-only
    provenance: [xml-schema, project-client]
    transport: model_write
    xml_contract: RGW/control_telnet/enable_telnet
    notes:
      - Static analysis did not identify a clear telnetd, BusyBox, Dropbear or /bin/sh implementation.
      - A client should require confirmed enable/disable values plus API read-back and port verification.

  diagnostic:
    description: Diagnostic XML contract; no active native handler was identified in the deeply traced 2.5.96 registration entry.
    access: none-confirmed
    risk: unknown
    confidence: schema-only
    provenance: [xml-schema, native-handler]
    xml_contract:
      - diagnostic/command
      - diagnostic/arg
      - diagnostic/output
    notes:
      - Do not describe this stock model as arbitrary command execution.
      - Community lab firmware can deliberately attach a custom callback; that is not stock behaviour.

actions:
  GetInfo:
    method: GET
    path: /xml_action.cgi
    query:
      Action: GetInfo
      Id: "<id>"
    access: read
    risk: low-to-sensitive
    confidence: firmware-confirmed
    provenance: [web-ui-js, native-handler]
    notes:
      - Some IDs/routes appear in the pre-session allowlist; downstream checks can still apply.

  BackupFwStart:
    method: GET
    path: /xml_action.cgi
    query:
      Action: BackupFwStart
    access: command
    risk: high-load
    confidence: live-tested
    provenance: [live-device, web-ui-js, native-handler]
    purpose: Start firmware-backup preparation.
    notes:
      - On live MF885 2.5.94 this temporarily disrupted cellular/PDP service; do not automatically retry it.

  BackupFw:
    method: GET
    path: /xml_action.cgi
    query:
      Action: BackupFw
    access: sensitive-download
    risk: critical
    confidence: live-tested
    provenance: [live-device, web-ui-js, native-handler]
    purpose: Download the prepared firmware backup.
    notes:
      - This action string appears in a pre-session allowlist in analysed firmware.
      - The allowlist bypasses the generic session gate only; it does not prove unconditional unauthenticated success.

  UploadFirmware:
    method: POST
    path: /xml_action.cgi
    multipart: true
    query:
      Action: Upload
      file: upgrade
      command: ""
    access: destructive-upload
    risk: critical
    confidence: frontend-confirmed
    provenance: [web-ui-js]

  RestoreConfig:
    method: POST
    path: /xml_action.cgi
    multipart: true
    query:
      Action: Upload
      file: backfile
      config_backup: ""
    access: destructive-upload
    risk: critical
    confidence: frontend-confirmed
    provenance: [web-ui-js]

pre_session_allowlist_observed_2_5_96:
  # These entries were observed before the normal session gate in static analysis.
  # They are not equivalent to "guaranteed unauthenticated endpoint".
  - Action=GetInfo
  - file=locale
  - file=debugmodeon
  - file=sdenable
  - file=alert0
  - file=alert2
  - file=alert3
  - Action=BackupFw

client_rules:
  - Re-authenticate on 401 for safe/read operations instead of blindly replaying state-changing requests.
  - For normal writes, POST then GET and verify the actual state.
  - Do not automatically retry restart/shutdown after connection loss or 401.
  - Keep unknown firmware enum values raw.
  - Never probe unknown destructive write values.
  - Redact credentials, Digest material and device identifiers from diagnostics.
