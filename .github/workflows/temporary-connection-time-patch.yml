name: Temporary connection-time patch

on:
  push:
    branches:
      - agent/fix-mf885-uptime

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mf885-uptime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted connection-time change
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('scriptable.js')
          s = path.read_text()

          old_export = 'formatBytes, parseBattery'
          if old_export not in s:
              raise SystemExit('export anchor missing')
          s = s.replace(old_export, 'formatBytes, formatDuration, parseBattery', 1)
          s = s.replace(', hardwareRevision, normalizeUptime, formatUptime };', ', hardwareRevision };', 1)

          s, count = re.subn(
              r'\nfunction normalizeUptime\(value\) \{[\s\S]*?\nfunction profileVersionWarning',
              '\nfunction profileVersionWarning',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'uptime helper block replacement count={count}')

          if '    model.uptime=normalizeUptime(status);\n' not in s:
              raise SystemExit('model uptime anchor missing')
          s = s.replace('    model.uptime=normalizeUptime(status);\n', '', 1)

          payload_anchor = '    trafficUp: formatBytes(model.traffic && model.traffic.upload),\n'
          if payload_anchor not in s:
              raise SystemExit('poll payload anchor missing')
          s = s.replace(
              payload_anchor,
              payload_anchor + '    connectionTime: formatDuration(model.traffic && model.traffic.sessionSeconds),\n',
              1,
          )

          old_duration = 'function formatDuration(seconds) { if (seconds === null || seconds === undefined) return ""; const s=Math.max(0, seconds|0), h=Math.floor(s/3600), m=Math.floor((s%3600)/60); return h ? `${h}h ${m}m` : `${m}m ${s%60}s`; }'
          new_duration = '''function formatDuration(seconds) {
            if (seconds === null || seconds === undefined || !Number.isFinite(Number(seconds))) return "—";
            const s=Math.max(0,Math.floor(Number(seconds))),days=Math.floor(s/86400),hours=Math.floor((s%86400)/3600),minutes=Math.floor((s%3600)/60),secs=s%60;
            if(days)return `${days}d ${String(hours).padStart(2,"0")}h ${String(minutes).padStart(2,"0")}m`;
            if(hours)return `${hours}h ${String(minutes).padStart(2,"0")}m`;
            return `${minutes}m ${String(secs).padStart(2,"0")}s`;
          }'''
          if old_duration not in s:
              raise SystemExit('formatDuration anchor missing')
          s = s.replace(old_duration, new_duration, 1)

          old_label = '  const uptimeLabel = formatUptime(model.uptime);'
          if old_label not in s:
              raise SystemExit('uptime label anchor missing')
          s = s.replace(old_label, '  const connectionTime = formatDuration(traffic.sessionSeconds);', 1)

          old_toolbar = '  <section class="power-toolbar" data-power-control><span>Uptime: <strong>${escapeHtml(uptimeLabel)}</strong></span><button class="danger" type="button" data-power-action="powerOff">Power off</button><div class="warning" data-power-confirm hidden></div></section>'
          new_toolbar = '  <section class="power-toolbar" data-power-control><span>Connection time: <strong data-connection-time>${escapeHtml(connectionTime)}</strong></span><button class="danger" type="button" data-power-action="powerOff">Power off</button><div class="warning" data-power-confirm hidden></div></section>'
          if old_toolbar not in s:
              raise SystemExit('toolbar anchor missing')
          s = s.replace(old_toolbar, new_toolbar, 1)

          poll_anchor = "setAll('[data-traffic-up]',payload.trafficUp||'—');if(payload.cellularDiagnostics)"
          if poll_anchor not in s:
              raise SystemExit('client poll anchor missing')
          s = s.replace(
              poll_anchor,
              "setAll('[data-traffic-up]',payload.trafficUp||'—');setAll('[data-connection-time]',payload.connectionTime||'—');if(payload.cellularDiagnostics)",
              1,
          )

          path.write_text(s)

          tests = Path('tests/dashboard-html.test.js')
          t = tests.read_text()
          t, count = re.subn(
              r"\ntest\('uptime normalization[\s\S]*?(?=\ntest\('SMS and router models render)",
              '',
              t,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'uptime test removal count={count}')
          tests.write_text(t)

          Path('tests/connection-time.test.js').write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          global.Script = { name: () => 'MF885 Test' };
          const app = require('../scriptable.js');

          function model(traffic = {}) {
            return {
              tab: 'router', loadedAt: Date.now(),
              sms: { messages: [], loading: false }, errors: {},
              network: {}, battery: {}, traffic,
              cellularDiagnostics: {},
              ussd: { state: 'unchecked', detail: 'Not checked' },
              deviceAccess: { state: 'unchecked', detail: 'Not checked', capabilities: [] },
              cellularControl: { state: 'unchecked', detail: 'Not checked' }
            };
          }

          test('WAN connection time comes from current-session conn_* counters', () => {
            const xml = '<RGW><WanStatistics>' +
              '<conn_days>3</conn_days><conn_hours>4</conn_hours>' +
              '<conn_minutes>17</conn_minutes><conn_seconds>12</conn_seconds>' +
              '</WanStatistics></RGW>';
            const traffic = app.parseTraffic(xml);
            assert.equal(traffic.sessionSeconds, 274632);
            assert.equal(app.formatDuration(traffic.sessionSeconds), '3d 04h 17m');
          });

          test('connection time is labelled as WAN connection time, not router uptime', () => {
            const html = app.buildHtml(model({ sessionSeconds: 274632 }));
            const toolbar = html.slice(html.indexOf('<section class="power-toolbar"'), html.indexOf('<nav class="seg dashboard-tabs"'));
            assert.match(toolbar, /Connection time: <strong data-connection-time>3d 04h 17m<\/strong>/);
            assert.doesNotMatch(toolbar, /Uptime:/);
            assert.match(toolbar, /data-power-action="powerOff"/);
          });

          test('missing connection counter has an explicit fallback', () => {
            const html = app.buildHtml(model({}));
            assert.match(html, /Connection time: <strong data-connection-time>—<\/strong>/);
          });

          test('normal status polling carries and updates connection time', () => {
            const payload = app.webPollPayload(model({ sessionSeconds: 274632 }));
            assert.equal(payload.connectionTime, '3d 04h 17m');
            const js = app.clientScript(model());
            assert.match(js, /\[data-connection-time\]/);
            assert.match(js, /payload\.connectionTime/);
          });
          '''.replace(/^          /gm, ''))
      - name: Validate
        run: |
          node --check scriptable.js
          node --test
          git diff --check
      - name: Commit validated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scriptable.js tests/dashboard-html.test.js tests/connection-time.test.js
          git commit -m "Replace unsupported uptime with WAN connection time"
          git push origin HEAD:agent/fix-mf885-uptime
